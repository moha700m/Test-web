name: Enable unlimited test runs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove run-count cap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api = Path('worker/api.js')
          text = api.read_text()
          old = '''      const total = await store.get(\n        "SELECT COUNT(*) AS n FROM challenges WHERE session = ?",\n        session,\n      );\n      if (total.n >= 8)\n        throw new Problem("وصلت الحد المؤقت للتحقق. حاول بعد 30 دقيقة.", 429);\n'''
          if old in text:
              text = text.replace(old, '', 1)
          api.write_text(text)

          app = Path('src/App.jsx')
          text = app.read_text()
          text = text.replace(
              'يدعم أي دومين HTTPS عام تملكه، بما فيه الدومينات الخاصة وروابط\n              Vercel وNetlify وCloudflare Pages وGitHub Pages وReplit.',
              'يدعم أي دومين HTTPS عام تملكه، وعدد مرات الاختبار غير محدود. كل تشغيل يبقى ضمن حدود حمل آمنة.'
          )
          text = text.replace(
              '"دقيقة انتظار بين اختبارات نفس الموقع",',
              '"عدد مرات الاختبار غير محدود، مع دقيقة انتظار بين اختبارات نفس الموقع",',
          )
          app.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Commit change
        shell: bash
        run: |
          rm .github/workflows/unlimited-runs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/api.js src/App.jsx .github/workflows/unlimited-runs.yml
          git commit -m "feat: allow unlimited test runs"
          git push origin HEAD:main
