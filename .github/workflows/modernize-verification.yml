name: Modernize ownership verification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch verification flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api = Path('worker/api.js')
          text = api.read_text()

          needle = '''      try {\n        const r = await fetcher(c.origin + "/.well-known/site-check.txt", {\n          redirect: "manual",\n          signal: controller.signal,\n          headers: {\n            "User-Agent": "WebsiteCheck/1.0 (ownership verification)",\n            Accept: "text/plain",\n          },\n        });'''

          replacement = '''      try {\n        // Modern default: prove control by publishing a meta tag on the public homepage.\n        // The legacy .well-known text file remains supported as a fallback.\n        try {\n          const page = await fetcher(c.origin + "/", {\n            redirect: "manual",\n            signal: controller.signal,\n            headers: {\n              "User-Agent": "WebsiteCheck/1.0 (ownership verification)",\n              Accept: "text/html",\n            },\n          });\n          if (page.status === 200) {\n            const declared = Number(page.headers.get("content-length") || 0);\n            if (!declared || declared <= 262144) {\n              let html = "", bytes = 0;\n              const reader = page.body?.getReader();\n              if (reader) {\n                while (true) {\n                  const { value, done } = await reader.read();\n                  if (done) break;\n                  bytes += value.length;\n                  if (bytes > 262144) {\n                    await reader.cancel();\n                    html = "";\n                    break;\n                  }\n                  html += new TextDecoder().decode(value, { stream: true });\n                }\n              }\n              const escaped = c.token.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&");\n              const meta = new RegExp(\n                `<meta\\\\b(?=[^>]*\\\\bname\\\\s*=\\\\s*["']site-check["'])(?=[^>]*\\\\bcontent\\\\s*=\\\\s*["']${escaped}["'])[^>]*>`,\n                "i",\n              );\n              if (meta.test(html)) return;\n            } else {\n              await page.body?.cancel();\n            }\n          } else {\n            await page.body?.cancel();\n          }\n        } catch (e) {\n          if (e?.name === "AbortError") throw e;\n          // Fall through to the legacy file method.\n        }\n\n        const r = await fetcher(c.origin + "/.well-known/site-check.txt", {\n          redirect: "manual",\n          signal: controller.signal,\n          headers: {\n            "User-Agent": "WebsiteCheck/1.0 (ownership verification)",\n            Accept: "text/plain",\n          },\n        });'''

          if needle not in text:
              raise SystemExit('api verification block not found')
          text = text.replace(needle, replacement, 1)
          text = text.replace(
              '"ملف التحقق ما يظهر مباشرة. انشره وتأكد أنه يرجع HTTP 200 بدون تحويل.",',
              '"ما لقينا رمز التحقق. أضف Meta Tag في <head> أو استخدم ملف التحقق الاحتياطي.",',
              1,
          )
          text = text.replace(
              '"نص ملف التحقق مو مطابق. انسخ البرومبت الحالي وانشر التعديل.",',
              '"رمز التحقق غير مطابق. انسخ البرومبت الحالي وانشر التعديل ثم حاول مرة ثانية.",',
              1,
          )
          text = text.replace(
              '"تعذّر الوصول لملف التحقق خلال 4 ثوانٍ. تأكد أن الموقع منشور ومتاح.",',
              '"تعذّر التحقق خلال 4 ثوانٍ. تأكد أن الموقع منشور وأن Meta Tag ظاهر في كود الصفحة.",',
              1,
          )
          api.write_text(text)

          app = Path('src/App.jsx')
          text = app.read_text()
          old = '''  const chosen = plans.find((p) => p[0] === plan),\n    prompt = challenge\n      ? `أضف ملف نصي عام إلى مشروعي بالمسار public/.well-known/site-check.txt يحتوي فقط على النص التالي:\\n${challenge.token}\\nلا تغيّر وظائف المشروع. انشر التعديل، وتأكد أن ${challenge.proofUrl} يعرض النص مباشرة برمز HTTP 200، بدون تسجيل دخول أو تحويل.`\n      : "";'''
          new = '''  const chosen = plans.find((p) => p[0] === plan),\n    metaTag = challenge\n      ? `<meta name="site-check" content="${challenge.token}">`\n      : "",\n    prompt = challenge\n      ? `أضف Meta Tag التالي داخل <head> في الصفحة الرئيسية لموقعي، بدون تغيير أي وظيفة أو تصميم:\\n${metaTag}\\nانشر التعديل بعد إضافته وتأكد أن الـ Meta Tag موجود في HTML المنشور.`\n      : "";'''
          if old not in text:
              raise SystemExit('app prompt block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'setMessage("أضف ملف التحقق لموقعك، ثم اضغط «تحقق من الملكية».");',
              'setMessage("أضف Meta Tag للموقع، انشر التعديل، ثم اضغط «تحقق الآن».");',
              1,
          )
          text = text.replace(
              'setMessage("تم نسخ البرومبت. أرسله لأداة بناء موقعك.");',
              'setMessage("تم نسخ البرومبت. أرسله لأداة بناء موقعك ثم انشر التعديل.");',
              1,
          )

          old_ui = '''                {!verified && (\n                  <>\n                    <p>\n                      أرسل البرومبت لأداة الفايب كودنق، وانشر التعديل على موقعك.\n                    </p>\n                    <textarea\n                      aria-label="برومبت ملف التحقق"\n                      readOnly\n                      value={prompt}\n                    />\n                    <div className="actions">\n                      <button className="secondary" onClick={copy}>\n                        <Icon name="copy" /> انسخ البرومبت\n                      </button>\n                      <button\n                        className="primary"\n                        onClick={verify}\n                        disabled={!!busy}\n                      >\n                        {busy === "verify" ? "جاري التحقق…" : "تحقق من الملكية"}\n                      </button>\n                    </div>\n                    <a\n                      className="proof"\n                      href={challenge.proofUrl}\n                      target="_blank"\n                      rel="noreferrer"\n                    >\n                      افتح ملف التحقق <Icon name="up-right-from-square" />\n                    </a>\n                  </>\n                )}'''

          new_ui = '''                {!verified && (\n                  <>\n                    <p>\n                      الأسرع الآن: أرسل البرومبت لأداة بناء موقعك. تضيف سطرًا واحدًا داخل <code>&lt;head&gt;</code> وتنشره.\n                    </p>\n                    <div\n                      dir="ltr"\n                      style={{\n                        padding: "14px 16px",\n                        border: "1px solid #353d4f",\n                        borderRadius: 5,\n                        background: "#080e1b",\n                        color: "#dfe3ec",\n                        overflowX: "auto",\n                        fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",\n                        fontSize: 13,\n                        whiteSpace: "nowrap",\n                      }}\n                    >\n                      {metaTag}\n                    </div>\n                    <div className="actions">\n                      <button className="secondary" onClick={copy}>\n                        <Icon name="copy" /> نسخ لأداة البناء\n                      </button>\n                      <button\n                        className="primary"\n                        onClick={verify}\n                        disabled={!!busy}\n                      >\n                        {busy === "verify" ? "جاري التحقق…" : "تحقق الآن"}\n                      </button>\n                    </div>\n                    <details style={{ marginTop: 14, color: "#8d94a3", fontSize: 13 }}>\n                      <summary style={{ cursor: "pointer" }}>طريقة بديلة للمشاريع القديمة</summary>\n                      <p style={{ marginTop: 10 }}>\n                        ما زال بإمكانك استخدام ملف <code dir="ltr">/.well-known/site-check.txt</code> بنفس رمز التحقق.\n                      </p>\n                      <a\n                        className="proof"\n                        href={challenge.proofUrl}\n                        target="_blank"\n                        rel="noreferrer"\n                      >\n                        افتح رابط الملف الاحتياطي <Icon name="up-right-from-square" />\n                      </a>\n                    </details>\n                  </>\n                )}'''
          if old_ui not in text:
              raise SystemExit('ownership UI block not found')
          text = text.replace(old_ui, new_ui, 1)
          text = text.replace(
              '"انسخ البرومبت لأداة البناء وانشر ملف التحقق.",',
              '"انسخ البرومبت لأداة البناء؛ تضيف Meta Tag واحدًا ثم تنشر التعديل.",',
              1,
          )
          app.write_text(text)

          tests = Path('tests/api.test.mjs')
          text = tests.read_text()
          fixture = '''    if (req.url === "/.well-known/site-check.txt") {\n      res.end(token);\n      return;\n    }\n    starts.push(Date.now());'''
          fixture_new = '''    if (req.url === "/.well-known/site-check.txt") {\n      res.end(token);\n      return;\n    }\n    if (\n      req.url === "/" &&\n      req.headers["user-agent"]?.includes("(ownership verification)")\n    ) {\n      res.setHeader("Content-Type", "text/html");\n      res.end(`<html><head><meta name="site-check" content="${token}"></head><body>fixture</body></html>`);\n      return;\n    }\n    starts.push(Date.now());'''
          if fixture not in text:
              raise SystemExit('test fixture block not found')
          tests.write_text(text.replace(fixture, fixture_new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Commit verified change
        shell: bash
        run: |
          rm -f .github/workflows/modernize-verification.yml .verification-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/api.js src/App.jsx tests/api.test.mjs .github/workflows/modernize-verification.yml .verification-trigger
          git commit -m "feat: modernize ownership verification"
          git push origin HEAD:main
