name: Build integrated resilience suite

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply patch
        run: |
          python3 scripts/patch-resilience.py
          python3 scripts/fix-resilience-tests.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Commit verified change
        shell: bash
        run: |
          git rm .github/workflows/resilience-suite.yml scripts/patch-resilience.py scripts/fix-resilience-tests.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/api.js src/App.jsx tests/api.test.mjs
          git commit -m "feat: add integrated verified resilience testing"
          git push origin HEAD:main
